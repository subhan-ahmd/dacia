## -------- Project-wide Gradle settings --------
# Use JDK 17 and sane memory defaults
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# AndroidX / Jetifier (required for your dependencies)
android.useAndroidX=true
android.enableJetifier=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# Gradle performance
org.gradle.daemon=true
org.gradle.configureondemand=true
org.gradle.caching=true

# Smaller R / faster builds (fine with Compose)
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# If Studio picks the wrong JDK, set this (EDIT path as needed, then uncomment)
# org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17
